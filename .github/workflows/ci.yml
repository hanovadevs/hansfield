name: Release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.5.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Type check
        run: pnpm check
      - name: Unit and native media tests
        run: pnpm test
      - name: Browser and public BYOK tests
        run: pnpm test:e2e
      - name: Production build
        run: pnpm build
      - name: Platform adapter build regression
        run: node scripts/check-platform-build.mjs
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=https://jenera.example -t jenera:ci .
      - name: Check production startup and anonymous isolation
        run: |
          docker run --detach --name jenera-ci -p 3000:3000 \
            -e NEXT_PUBLIC_SITE_URL=https://jenera.example \
            -e SESSION_ENCRYPTION_KEY=abababababababababababababababababababababababababababababababab \
            -e HF_API_KEY=ignored-environment-key:must-not-be-used jenera:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          status=$(curl --silent -o /tmp/jenera-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3000/api/generations)
          test "$status" = 401
      - name: Container logs
        if: always()
        run: docker logs jenera-ci || true
